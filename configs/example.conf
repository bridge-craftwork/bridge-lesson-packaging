# Example collection config for package.sh (sourced as bash; --config or environment).
# Nothing here identifies a specific collection — provenance/license are the collection's own.

INPUT_DIR="Presentation"          # clean lesson PBNs, arranged {category}/{lesson}/
OUTPUT_DIR="Rotations"            # packaged output tree
SET_SIZES="4 5 6"                # board-set slice sizes; a lesson <= a size stays one set
ROTATE_PATTERNS="S,NS,NESW"      # views: online S/NS + in-person NESW
DECLARER_PLAN_CATEGORY="Declarer Play"  # restrict the plan to these categories; "" = every lesson
LIN="0"                          # 1 = also emit LIN files for online play

# Tool paths (defaults shown; override if installed elsewhere)
# BRIDGE_WRANGLER_PATH="$HOME/Development/GitHub/bridge-wrangler/target/release/bridge-wrangler"
# PDF_HANDOUTS_PATH="$HOME/Development/GitHub/pdf-handouts/target/release/pdf-handouts"

# Collection-defined groupings (optional). A subfolder of PBNs inside each lesson's
# input folder; each is packaged into its own folder, treated like All/.
# GROUP_DIR="Chapters"

# Lessons whose folders hold more than one PBN (optional). DEALS_GLOB picks the deals;
# COMPANION_PBNS (';'-separated, in order) are rendered as-is to the front of the handouts.
# {stem} = the deals file name less DEALS_GLOB's suffix, so each lesson finds its own.
# (Assign COMPANION_PBNS plainly: inside "${VAR:-...}" the braces of {stem} end it early.)
# DEALS_GLOB="* practice deals.pbn"
# COMPANION_PBNS='{stem} exercises.pbn;{stem} review exercises.pbn'
# HANDOUT_VIEWS="NESW NS S"      # views that get a merged Handouts PDF (default NESW)
# ROTATE_VUL="rotate"            # keep the source's vulnerability, turned with the hands
#                                # (default "standard": by board number)
# STRIP_TAGS="Site Date Event %PageFooter %BCOptions:PageHeader"   # dropped from the deals PBN
# TIDY_LESSON_ROOT="1"           # lesson folder keeps only its given documents (lesson plan);
#                                # the copied PBNs and rendered companions are removed
